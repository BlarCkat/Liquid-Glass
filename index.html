<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Glass Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed render, the glass voice button at its optical centre, a tuning tray docked at the bottom. */
:root {
  --ink: #050b1f;
  --fg: #eef4ff;
  --muted: #9bb0d8;
  --line: rgba(190, 210, 255, 0.2);
  --tray: rgba(12, 20, 44, 0.5);
  --chip: rgba(255, 255, 255, 0.08);
  --chip-on: rgba(255, 255, 255, 0.92);
  --chip-on-fg: #0b1430;
  --accent: #7fe3ff;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
body[data-tone="light"] {
  --fg: #2a1712; --muted: #6d4c43; --line: rgba(80, 40, 30, 0.18);
  --tray: rgba(255, 240, 232, 0.45); --chip: rgba(60, 30, 20, 0.07);
  --chip-on: #2a1712; --chip-on-fg: #fff3ec; --accent: #c2412b;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--fg); overflow: hidden; font-family: var(--display); }
canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
header {
  position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header h1 { margin: 0; font-size: clamp(20px, 3vw, 28px); font-weight: 700; letter-spacing: -0.01em; }
header p { margin: 4px 0 0; font: 400 12px/1.5 var(--mono); color: var(--muted); max-width: 46ch; }
#rec {
  position: fixed; left: 0; top: 0; transform: translate(-50%, -50%);
  background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer;
  border-radius: 999px; color: var(--fg);
  display: flex; align-items: center; justify-content: center; gap: 12px;
  -webkit-tap-highlight-color: transparent;
}
#rec:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
#rec svg { width: 26px; height: 26px; flex: none; }
#bars { display: flex; align-items: center; gap: 3px; height: 26px; }
#bars i { display: block; width: 3px; border-radius: 2px; background: var(--fg); opacity: .9; height: 4px; }
#clock { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; }
#hint { position: fixed; left: 0; top: 0; transform: translate(-50%, 0); font: 400 12px var(--mono); color: var(--muted); pointer-events: none; white-space: nowrap; }
.tray {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: min(460px, calc(100% - 32px));
  background: var(--tray); border: 1px solid var(--line); border-radius: 16px;
  -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%);
  padding: 12px 14px; display: grid; gap: 10px;
}
.scenes { display: flex; flex-wrap: wrap; gap: 6px; }
.scenes button {
  font: 500 12px var(--mono); color: var(--fg); background: var(--chip);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; cursor: pointer;
}
.scenes button[aria-checked="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: transparent; }
.scenes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sliders { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 16px; }
.sliders label { display: grid; gap: 4px; font: 400 10.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; min-width: 0; }
.sliders label span { display: flex; justify-content: space-between; gap: 6px; }
.sliders output { color: var(--fg); font-variant-numeric: tabular-nums; }
.sliders input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.meta { font: 400 10.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
#nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 400 14px var(--mono); color: var(--muted); white-space: pre-wrap; }
[hidden] { display: none !important; }
@media (max-width: 480px) { .sliders { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>


<canvas id="stage" aria-hidden="true"></canvas>
<header>
  <h1>Liquid Glass Lab</h1>
  <p>Raymarched scenes with soft shadows, AO, reflections and bloom. Move near the button to bend it, tap it to talk.</p>
</header>

<button id="rec" type="button" aria-pressed="false" aria-label="Start recording">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="9" y="3" width="6" height="11" rx="3"></rect>
    <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path>
  </svg>
  <div id="bars" hidden><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <span id="clock" hidden>0:00</span>
</button>
<div id="hint">Tap to talk</div>

<div class="tray">
  <div class="scenes" role="radiogroup" aria-label="Background scene">
    <button type="button" role="radio" data-scene="0" aria-checked="true">Ocean</button>
    <button type="button" role="radio" data-scene="1" aria-checked="false">Chrome</button>
    <button type="button" role="radio" data-scene="2" aria-checked="false">Clay</button>
    <button type="button" role="radio" data-scene="3" aria-checked="false">Satin</button>
    <button type="button" role="radio" data-scene="4" aria-checked="false">Neon</button>
  </div>
  <div class="sliders" role="group" aria-label="Glass and render settings">
    <label for="refr"><span>Refraction <output id="refrO">30</output></span><input id="refr" type="range" min="0" max="60" step="1" value="30"></label>
    <label for="blur"><span>Frost <output id="blurO">0.5</output></span><input id="blur" type="range" min="0" max="6" step="0.25" value="0.5"></label>
    <label for="chroma"><span>Dispersion <output id="chromaO">1.5</output></span><input id="chroma" type="range" min="0" max="6" step="0.5" value="1.5"></label>
    <label for="bend"><span>Bend <output id="bendO">0.8</output></span><input id="bend" type="range" min="0" max="1.2" step="0.05" value="0.8"></label>
    <label for="bloom"><span>Bloom <output id="bloomO">1</output></span><input id="bloom" type="range" min="0" max="2" step="0.1" value="1"></label>
    <label for="expo"><span>Exposure <output id="expoO">1</output></span><input id="expo" type="range" min="0.5" max="1.8" step="0.05" value="1"></label>
  </div>
  <div class="meta" id="meta">Render —</div>
</div>
<div id="nogl" hidden>This demo needs WebGL 2, which this browser has turned off.</div>

<script>
(() => {
const canvas = document.getElementById('stage');
const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const fail = msg => { const n = document.getElementById('nogl'); n.hidden = false; if (msg) n.textContent = msg; };
if (!gl) { fail(); return; }

const VERT = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;

/* ───────────── Pass 1: the 3D scene (rendered to a texture) ─────────────
   Sphere-traced signed distance fields, Eevee-style shading:
   soft shadows, ambient occlusion, one reflection bounce, studio softbox environment,
   wrap lighting for clay, sheen for satin, emissive neon with point lights, ACES tone map. */
const SCENE = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime, uExpo; uniform int uScene; uniform vec2 uPar;
out vec4 o;

vec3 gSky, gGround, gBox, gStripL, gStripR, gKeyDir, gKeyCol;

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b-a)/k, 0., 1.); return mix(b, a, h) - k*h*(1.-h); }
float sdTorus(vec3 p, vec2 t){ vec2 q = vec2(length(p.xz) - t.x, p.y); return length(q) - t.y; }
float sdRBox(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.) - r; }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba)/dot(ba, ba), 0., 1.); return length(pa - ba*h) - r; }
vec2 opU(vec2 a, vec2 b){ return a.x < b.x ? a : b; }
float cove(vec3 p){ return smin(p.y, p.z + 3.2, 2.2); }   // seamless photo-studio sweep

vec2 map(vec3 p){
  float t = uTime;
  if (uScene == 0) {            // Ocean: glossy blue spheres on a deep-blue sweep
    vec2 r = vec2(cove(p), 0.);
    r = opU(r, vec2(length(p - vec3(-1.7, 0.83 + 0.05*sin(t*0.8),      0.1)) - 0.78, 1.));
    r = opU(r, vec2(length(p - vec3( 0.8, 0.60 + 0.05*sin(t*0.9 + 1.), -0.7)) - 0.55, 2.));
    r = opU(r, vec2(length(p - vec3( 2.2, 0.46 + 0.04*sin(t + 2.),      0.7)) - 0.42, 3.));
    r = opU(r, vec2(length(p - vec3(-0.25,0.36 + 0.03*sin(t*1.1 + 3.),  1.3)) - 0.33, 4.));
    r = opU(r, vec2(length(p - vec3(-3.4, 0.62, -1.2)) - 0.6, 5.));
    r = opU(r, vec2(length(p - vec3( 3.6, 1.06 + 0.05*sin(t*0.7), -1.6)) - 1.0, 6.));
    return r;
  }
  if (uScene == 1) {            // Chrome: a liquid-metal metaball floating in a studio
    vec2 r = vec2(cove(p), 0.);
    vec3 q = p - vec3(0., 1.4, 0.);
    float d = 1e5;
    for (int i = 0; i < 5; i++) {
      float fi = float(i);
      vec3 c = vec3(sin(t*0.5 + fi*1.3)*1.15, sin(t*0.37 + fi*2.1)*0.42, cos(t*0.43 + fi*1.7)*0.6);
      d = smin(d, length(q - c) - (0.42 + 0.2*fract(fi*0.618 + 0.2)), 0.7);
    }
    return opU(r, vec2(d, 1.));
  }
  if (uScene == 2) {            // Clay: matte pastel primitives, one bouncing ball
    vec2 r = vec2(cove(p), 0.);
    vec3 q = p - vec3(-2.1, 0.62, -0.2); q.xz *= rot(t*0.3); q.yz *= rot(1.5708);
    r = opU(r, vec2(sdTorus(q, vec2(0.45, 0.17)), 1.));
    q = p - vec3(0.15, 0.55, -0.7); q.xz *= rot(t*0.25 + 0.6);
    r = opU(r, vec2(sdRBox(q, vec3(0.55), 0.12), 2.));
    r = opU(r, vec2(sdCapsule(p, vec3(1.5, 0.3, 0.75), vec3(2.8, 0.3, 0.1), 0.3), 3.));
    r = opU(r, vec2(length(p - vec3(-0.75, 0.38 + 0.55*abs(sin(t*1.6)), 1.2)) - 0.38, 4.));
    r = opU(r, vec2(sdRBox(p - vec3(1.05, 0.12, 1.55), vec3(0.42, 0.12, 0.42), 0.08), 5.));
    return r;
  }
  if (uScene == 3) {            // Satin: draped fabric waves
    float h = 0.32*sin(p.x*1.1 + t*0.35 + 1.4*sin(p.z*0.6 + t*0.2))
            + 0.18*sin(p.z*1.9 - t*0.27 + p.x*0.6)
            + 0.06*sin(p.x*3.7 + p.z*2.3 + t*0.5);
    return vec2((p.y - h)*0.3, 1.);
  }
  // Neon: three emissive rings and a dark glossy sphere on a mirror floor
  vec2 r = vec2(cove(p), 0.);
  vec3 q = p - vec3(0., 1.35, -0.8); q.xz *= rot(t*0.2);       q.yz *= rot(1.5708);
  r = opU(r, vec2(sdTorus(q, vec2(1.15, 0.06)), 1.));
  q = p - vec3(-2.0, 0.78, 0.5);     q.xz *= rot(-t*0.35 + 1.); q.yz *= rot(1.5708);
  r = opU(r, vec2(sdTorus(q, vec2(0.66, 0.05)), 2.));
  q = p - vec3(2.1, 0.92, 0.2);      q.xz *= rot(t*0.28 + 2.);  q.yz *= rot(1.5708);
  r = opU(r, vec2(sdTorus(q, vec2(0.8, 0.055)), 3.));
  r = opU(r, vec2(length(p - vec3(0.1, 0.5, 0.6)) - 0.5, 4.));
  return r;
}

vec3 calcNormal(vec3 p){
  const vec2 e = vec2(1., -1.)*0.0015;
  return normalize(e.xyy*map(p + e.xyy).x + e.yyx*map(p + e.yyx).x + e.yxy*map(p + e.yxy).x + e.xxx*map(p + e.xxx).x);
}
float softShadow(vec3 ro, vec3 rd, float k){
  float res = 1., t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = map(ro + rd*t).x;
    res = min(res, k*h/t);
    t += clamp(h, 0.02, 0.35);
    if (res < 0.002 || t > 10.) break;
  }
  return clamp(res, 0., 1.);
}
float calcAO(vec3 p, vec3 n){
  float occ = 0., sca = 1.;
  for (int i = 0; i < 5; i++) { float h = 0.02 + 0.13*float(i); occ += (h - map(p + n*h).x)*sca; sca *= 0.88; }
  return clamp(1. - 2.4*occ, 0., 1.);
}

vec3 env(vec3 rd){
  vec3 c = mix(gGround, gSky, smoothstep(-0.25, 0.7, rd.y));
  c += gBox * smoothstep(0.8, 0.9, rd.y);                                   // overhead softbox
  vec2 h = normalize(rd.xz + 1e-5);
  float band = smoothstep(-0.05, 0.15, rd.y) * smoothstep(0.75, 0.45, rd.y);
  c += gStripL * smoothstep(0.86, 0.95, -h.x) * band;                         // left strip light
  c += gStripR * smoothstep(0.86, 0.95,  h.x) * band;                         // right strip light
  return c;
}

struct Mat { vec3 alb; float rough; float metal; vec3 emit; float wrap; float sheen; };
Mat getMat(float id, vec3 p){
  Mat m; m.alb = vec3(0.5); m.rough = 0.5; m.metal = 0.; m.emit = vec3(0.); m.wrap = 0.; m.sheen = 0.;
  if (uScene == 0) {
    if (id < 0.5) { m.alb = vec3(0.02, 0.07, 0.26); m.rough = 0.55; }
    else { m.alb = mix(vec3(0.008, 0.07, 0.5), vec3(0.12, 0.48, 0.95), fract(id*0.37)); m.rough = 0.08; }
  } else if (uScene == 1) {
    if (id < 0.5) { m.alb = vec3(0.05, 0.05, 0.055); m.rough = 0.3; }
    else { m.alb = vec3(0.96, 0.94, 0.92); m.rough = 0.04; m.metal = 1.; }
  } else if (uScene == 2) {
    m.rough = 0.8; m.wrap = 0.35;
    if (id < 0.5) m.alb = vec3(0.86, 0.62, 0.55);
    else if (id < 1.5) m.alb = vec3(0.95, 0.42, 0.36);
    else if (id < 2.5) m.alb = vec3(0.98, 0.8, 0.4);
    else if (id < 3.5) m.alb = vec3(0.42, 0.83, 0.68);
    else if (id < 4.5) m.alb = vec3(0.68, 0.58, 0.95);
    else m.alb = vec3(0.45, 0.68, 0.98);
  } else if (uScene == 3) {
    m.alb = mix(vec3(0.08, 0.02, 0.3), vec3(0.5, 0.05, 0.3), smoothstep(-3., 3., p.x + 0.4*sin(p.z)));
    m.rough = 0.38; m.sheen = 1.; m.wrap = 0.2;
  } else {
    if (id < 0.5) { m.alb = vec3(0.012); m.rough = 0.12; }
    else if (id < 1.5) { m.alb = vec3(0.); m.emit = vec3(0.08, 0.72, 1.0)*2.6; }
    else if (id < 2.5) { m.alb = vec3(0.); m.emit = vec3(1.0, 0.1, 0.55)*2.6; }
    else if (id < 3.5) { m.alb = vec3(0.); m.emit = vec3(1.0, 0.42, 0.06)*2.6; }
    else { m.alb = vec3(0.03); m.rough = 0.15; }
  }
  return m;
}

vec3 neonLights(vec3 p, vec3 n, vec3 alb){
  vec3 c = vec3(0.);
  vec3 lp[3]; lp[0] = vec3(0., 1.35, -0.8); lp[1] = vec3(-2.0, 0.78, 0.5); lp[2] = vec3(2.1, 0.92, 0.2);
  vec3 lc[3]; lc[0] = vec3(0.25, 0.9, 1.0); lc[1] = vec3(1.0, 0.22, 0.7); lc[2] = vec3(1.0, 0.55, 0.15);
  for (int i = 0; i < 3; i++) {
    vec3 L = lp[i] - p; float d2 = dot(L, L); L *= inversesqrt(d2);
    c += alb*lc[i]*(0.6 + 0.4*max(dot(n, L), 0.))*2.2/(1. + d2*1.4);
  }
  return c;
}

// Cheap shading for what a reflection ray hits
vec3 shadeSimple(vec3 p, vec3 rd, float id){
  vec3 n = calcNormal(p);
  Mat m = getMat(id, p);
  float dif = clamp((dot(n, gKeyDir) + m.wrap)/(1. + m.wrap), 0., 1.);
  vec3 amb = mix(gGround, gSky, n.y*0.5 + 0.5);
  vec3 c = m.alb*(1. - m.metal)*(dif*gKeyCol + amb) + m.emit;
  c += m.metal*m.alb*env(reflect(rd, n));
  if (uScene == 4) c += neonLights(p, n, m.alb);
  return c;
}

vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03))/(x*(2.43*x + 0.59) + 0.14), 0., 1.); }

void setup(){
  gStripL = vec3(0.); gStripR = vec3(0.);
  if (uScene == 0) {
    gSky = vec3(0.07, 0.12, 0.3); gGround = vec3(0.005, 0.012, 0.045); gBox = vec3(2.2);
    gStripL = vec3(0.6, 0.8, 1.2); gStripR = vec3(0.4);
    gKeyDir = normalize(vec3(-0.5, 0.85, 0.45)); gKeyCol = vec3(1.0, 0.97, 0.92)*2.3;
  } else if (uScene == 1) {
    gSky = vec3(0.11, 0.105, 0.1); gGround = vec3(0.01); gBox = vec3(2.2);
    gStripL = vec3(2.2, 1.1, 0.45); gStripR = vec3(0.45, 0.9, 2.2);
    gKeyDir = normalize(vec3(-0.4, 0.9, 0.3)); gKeyCol = vec3(1.0, 0.95, 0.9)*1.6;
  } else if (uScene == 2) {
    gSky = vec3(0.4, 0.34, 0.32); gGround = vec3(0.12, 0.075, 0.065); gBox = vec3(1.0);
    gKeyDir = normalize(vec3(-0.6, 0.9, 0.55)); gKeyCol = vec3(1.0, 0.93, 0.85)*1.35;
  } else if (uScene == 3) {
    gSky = vec3(0.09, 0.06, 0.15); gGround = vec3(0.012, 0.004, 0.02); gBox = vec3(1.2, 1.0, 1.3);
    gStripL = vec3(1.4, 0.9, 1.2);
    gKeyDir = normalize(vec3(-0.85, 0.42, 0.25)); gKeyCol = vec3(1.0, 0.86, 0.9)*1.7;
  } else {
    gSky = vec3(0.012, 0.012, 0.025); gGround = vec3(0.003); gBox = vec3(0.12);
    gKeyDir = normalize(vec3(0., 1., 0.3)); gKeyCol = vec3(0.04);
  }
}

void main(){
  setup();
  float aspect = uRes.x/uRes.y;
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;

  vec3 ro = vec3(0., 1.55, 6.6), ta = vec3(0., 0.8, 0.);
  if (uScene == 1) ta.y = 1.2;
  if (uScene == 3) { ro = vec3(0., 3.1, 5.4); ta = vec3(0., 0., 0.); }
  ro.xy += uPar*vec2(0.7, -0.35);
  float fl = 1.9*clamp(aspect/1.25, 0.62, 1.);
  vec3 ww = normalize(ta - ro), uu = normalize(cross(ww, vec3(0., 1., 0.))), vv = cross(uu, ww);
  vec3 rd = normalize(uv.x*uu + uv.y*vv + fl*ww);

  float t = 0.; vec2 h = vec2(0.); bool hit = false;
  for (int i = 0; i < 200; i++) {
    h = map(ro + rd*t);
    if (h.x < 0.0004*t + 0.0002) { hit = true; break; }
    t += h.x;
    if (t > 32.) break;
  }

  vec3 col;
  if (!hit) col = env(rd);
  else {
    vec3 p = ro + rd*t, n = calcNormal(p);
    Mat m = getMat(h.y, p);
    float ao = calcAO(p, n);
    float sh = softShadow(p + n*0.003, gKeyDir, 9.);
    float ndl = dot(n, gKeyDir);
    float dif = clamp((ndl + m.wrap)/(1. + m.wrap), 0., 1.) * mix(sh, 1., m.wrap*0.4);
    vec3 amb = mix(gGround, gSky, n.y*0.5 + 0.5)*ao;
    float ndv = max(dot(n, -rd), 0.);
    vec3 F0 = mix(vec3(0.045), m.alb, m.metal);
    vec3 F = F0 + (1. - F0)*pow(1. - ndv, 5.)*(1. - m.rough*0.75);

    col = m.alb*(1. - m.metal)*(dif*gKeyCol + amb*1.1);
    // key-light specular (Blinn-Phong with roughness-driven lobe)
    vec3 H = normalize(gKeyDir - rd);
    float gloss = mix(900., 6., m.rough);
    col += gKeyCol*F*pow(max(dot(n, H), 0.), gloss)*sh*(gloss + 8.)/40.*(1. - m.rough*0.6);

    // one reflection bounce for smooth surfaces, environment fallback for rough ones
    vec3 r = reflect(rd, n);
    vec3 refl = env(r);
    if (m.rough < 0.5) {
      float rt = 0.02; vec2 rh = vec2(0.); bool rhit = false;
      vec3 rp = p + n*0.01;
      for (int i = 0; i < 64; i++) { rh = map(rp + r*rt); if (rh.x < 0.001*rt) { rhit = true; break; } rt += rh.x; if (rt > 18.) break; }
      if (rhit) refl = mix(shadeSimple(rp + r*rt, r, rh.y), refl, smoothstep(6., 18., rt));
    }
    refl = mix(refl, amb, smoothstep(0.15, 0.7, m.rough));
    col += refl*F*mix(1., ao, 0.7)*(m.metal > 0.5 ? m.alb : vec3(1.));

    if (m.sheen > 0.) col += m.sheen*vec3(1.0, 0.7, 0.85)*pow(1. - ndv, 3.)*0.22*(0.4 + 0.6*sh);
    if (uScene == 4) col += neonLights(p, n, m.alb + vec3(0.02))*ao;
    col += m.emit;

    col = mix(col, gGround, 1. - exp(-0.0025*t*t));     // gentle atmospheric depth
  }

  col = aces(col*uExpo);
  col = pow(col, vec3(1./2.2));
  o = vec4(col, 1.);
}`;

/* ───────────── Pass 2: liquid glass composited over the render ─────────────
   The render is sampled through refracted coordinates; mip levels give free frost and bloom. */
const GLASS = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes; uniform float uDpr, uTime, uLevel, uRefr, uBlur, uChroma, uBend, uStretch, uBloom;
uniform vec2 uCenter, uHalf, uPull, uMouse, uDir, uOffset;
out vec4 o;

float sdRoundBox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b-a)/k, 0., 1.); return mix(b, a, h) - k*h*(1.-h); }

// jelly: shift toward pointer, stretch along it, thin across it, bulge on the leading side
float glass(vec2 p){
  vec2 q = p - uCenter - uOffset;
  vec2 dn = vec2(-uDir.y, uDir.x);
  vec2 r = vec2(dot(q, uDir), dot(q, dn));
  r.x /= (1. + uStretch); r.y *= (1. + uStretch*0.45);
  q = r.x*uDir + r.y*dn;
  float pill = sdRoundBox(q, uHalf, uHalf.y);
  float bulge = length(p - uCenter - uPull*uBend*0.9) - uHalf.y*0.5;
  return smin(pill, bulge, uHalf.y*0.6);
}

vec3 sceneAt(vec2 p, float lod){
  vec2 uv = clamp(vec2(p.x/uRes.x, 1. - p.y/uRes.y), vec2(0.001), vec2(0.999));
  return textureLod(uTex, uv, lod).rgb;
}
vec3 bloomAt(vec2 p){
  vec3 b = sceneAt(p, 3.)*0.35 + sceneAt(p, 4.5)*0.35 + sceneAt(p, 6.)*0.3;
  return max(b - 0.72, 0.)*2.6*uBloom;
}
vec3 bgAt(vec2 p, float lod){ return sceneAt(p, lod) + bloomAt(p); }

void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y*uDpr - gl_FragCoord.y)/uDpr;
  float d = glass(p);
  vec3 col = bgAt(p, 0.);
  vec3 glowC = mix(vec3(0.35, 0.92, 1.0), vec3(0.78, 0.55, 1.0), 0.5 + 0.5*sin(uTime*1.7));

  float outside = smoothstep(-1., 1., d);
  float sd = glass(p - vec2(0., 12.));
  col *= 1. - 0.32*exp(-max(sd, 0.)/20.)*outside;
  col += glowC*uLevel*0.55*exp(-max(d, 0.)/26.)*outside;

  if (d < 1.) {
    vec2 e = vec2(1., 0.);
    vec2 g = normalize(vec2(glass(p + e.xy) - glass(p - e.xy), glass(p + e.yx) - glass(p - e.yx)) + 1e-6);
    float t = max(-d, 0.);
    float h = clamp(t/(uHalf.y*0.9), 0., 1.);
    float bend = pow(1. - sqrt(1. - (1. - h)*(1. - h)), 0.8);   // circular bevel
    vec2 s = p - g*bend*uRefr;                                 // rim magnifies and wraps the scene
    s = uCenter + (s - uCenter)*0.985;
    float m = exp(-dot(p - uMouse, p - uMouse)/(2.*46.*46.))*uBend;
    s = mix(s, uMouse, m*0.12);

    float lod = uBlur*0.75;
    vec2 ch = g*uChroma*(0.4 + bend);
    vec3 gc = vec3(bgAt(s + ch, lod).r, bgAt(s, lod).g, bgAt(s - ch, lod).b);
    gc = gc*1.04 + 0.02;

    float slope = 1. - h;
    vec3 n = normalize(vec3(g*slope*1.8, 1.));
    vec3 V = vec3(0., 0., 1.);
    vec3 L1 = normalize(vec3(-0.55, -0.75, 0.6)), L2 = normalize(vec3(0.55, 0.75, 0.6));
    gc += pow(max(dot(n, normalize(L1 + V)), 0.), 70.)*0.9 + pow(max(dot(n, normalize(L2 + V)), 0.), 90.)*0.35;
    float rim = smoothstep(1.6, 0., t);
    gc += rim*(0.22 + 0.55*clamp(dot(g, normalize(vec2(-.6, -.8))), 0., 1.));
    gc += pow(1. - h, 3.)*0.06;
    gc += glowC*uLevel*(0.12 + 0.85*exp(-t/11.));
    col = mix(col, gc, smoothstep(1., -1., d));
  }

  vec2 uvc = p/uRes - 0.5;
  col *= 1. - 0.22*dot(uvc, uvc)*2.;                          // lens vignette
  float n = fract(sin(dot(gl_FragCoord.xy + fract(uTime)*91.7, vec2(12.9898, 78.233)))*43758.5453);
  col += (n - 0.5)*0.016;                                      // film grain
  o = vec4(col, 1.);
}`;

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs, uniforms){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const U = {}; uniforms.forEach(n => U[n] = gl.getUniformLocation(p, n));
  return { p, U };
}
let sceneP, glassP;
try {
  sceneP = program(SCENE, ['uRes','uTime','uExpo','uScene','uPar']);
  glassP = program(GLASS, ['uTex','uRes','uDpr','uTime','uLevel','uRefr','uBlur','uChroma','uBend','uStretch','uBloom','uCenter','uHalf','uPull','uMouse','uDir','uOffset']);
} catch (err) { fail('Shader error:\n' + err.message); return; }

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// render target for the scene (mipmapped: frost + bloom come from its mip chain)
const tex = gl.createTexture();
const fbo = gl.createFramebuffer();
let W = 0, H = 0, dpr = 1, sw = 0, sh = 0;
let rs = 1;                 // render scale relative to the canvas, adapted to keep the frame rate smooth
const MAX_PIXELS = 3.2e6;
function allocScene(){
  const cw = canvas.width, ch = canvas.height;
  const cap = Math.min(1, Math.sqrt(MAX_PIXELS/(cw*ch)));
  rs = Math.min(rs, cap);
  sw = Math.max(64, Math.round(cw*rs)); sh = Math.max(64, Math.round(ch*rs));
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, sw, sh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  meta.textContent = `Render ${sw}×${sh}`;
}
const meta = document.getElementById('meta');
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  rs = Math.min(1, Math.sqrt(MAX_PIXELS/(canvas.width*canvas.height)));
  allocScene();
}
addEventListener('resize', resize); resize();

const params = {};
['refr','blur','chroma','bend','bloom','expo'].forEach(id => {
  const el = document.getElementById(id), out = document.getElementById(id + 'O');
  const set = () => { params[id] = parseFloat(el.value); out.textContent = el.value; };
  el.addEventListener('input', set); set();
});

let scene = 0;
const chips = [...document.querySelectorAll('.scenes button')];
function pickScene(i){
  scene = i;
  chips.forEach(c => c.setAttribute('aria-checked', String(+c.dataset.scene === i)));
  document.body.dataset.tone = i === 2 ? 'light' : 'dark';
}
chips.forEach((c, idx) => {
  c.addEventListener('click', () => pickScene(+c.dataset.scene));
  c.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const n = chips[(idx + (e.key === 'ArrowRight' ? 1 : chips.length - 1)) % chips.length];
    n.focus(); pickScene(+n.dataset.scene);
  });
});
pickScene(0);

// interaction state
const mouse = { x: -9999, y: -9999 };
const par = { x: 0, y: 0 };
const pull = { x: 0, y: 0, vx: 0, vy: 0 };
const width = { v: 44, vel: 0 };
const scale = { v: 1, vel: 0 };
let level = 0, recording = false, recStart = 0, pressed = 0;
const halfH = 40;

addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('pointerdown', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
document.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });

const btn = document.getElementById('rec'), bars = document.getElementById('bars'), clock = document.getElementById('clock'), hint = document.getElementById('hint');
const barEls = [...bars.children];
btn.addEventListener('pointerdown', () => { pressed = 1; });
addEventListener('pointerup', () => { pressed = 0; });
btn.addEventListener('click', () => {
  recording = !recording; recStart = performance.now();
  btn.setAttribute('aria-pressed', recording); btn.setAttribute('aria-label', recording ? 'Stop recording' : 'Start recording');
  bars.hidden = clock.hidden = !recording; hint.textContent = recording ? 'Listening (simulated voice)' : 'Tap to talk';
});

// stand-in for a microphone level; swap for an AnalyserNode RMS in your app
function fakeVoice(t){
  const syl = Math.max(0, Math.sin(t*7.3)*Math.sin(t*2.1 + 1));
  const tex = 0.6 + 0.4*Math.sin(t*17 + Math.sin(t*3));
  const phrase = Math.sin(t*0.9) > -0.35 ? 1 : 0.12;
  return Math.min(1, (syl*tex*1.1 + 0.06)*phrase);
}
function roundBoxSDF(px, py, cx, cy, hw, hh){
  const qx = Math.abs(px - cx) - hw + hh, qy = Math.abs(py - cy);   // pill: corner radius equals half height
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - hh;
}

const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const t0 = performance.now();
let last = t0, ema = 16.7, frames = 0;

function frame(now){
  // adaptive render scale: hold ~60fps, climb back up when there is headroom
  const dt = Math.min(100, now - last); last = now;
  ema = ema*0.92 + dt*0.08;
  if (++frames % 45 === 0) {
    const cap = Math.min(1, Math.sqrt(MAX_PIXELS/(canvas.width*canvas.height)));
    if (ema > 24 && rs > 0.3) { rs = Math.max(0.3, rs*0.82); allocScene(); }
    else if (ema < 17.6 && rs < cap) { rs = Math.min(cap, rs*1.1); allocScene(); }
  }

  const t = (now - t0)/1000*(reduce.matches ? 0.15 : 1);
  const cx = W/2, cy = H*0.46;

  const maxHalf = Math.min(150, (W - 48)/2);
  const targetW = recording ? maxHalf : halfH + 4;
  width.vel += (targetW - width.v)*0.09; width.vel *= 0.74; width.v += width.vel;
  const hw = Math.max(halfH, width.v);

  const dx = mouse.x - cx, dy = mouse.y - cy, dist = Math.hypot(dx, dy) || 1;
  const near = Math.max(0, 1 - Math.max(0, roundBoxSDF(mouse.x, mouse.y, cx, cy, hw, halfH))/150);
  const reach = Math.min(dist*0.55, halfH*1.1)*near;
  pull.vx += (dx/dist*reach - pull.x)*0.12; pull.vy += (dy/dist*reach - pull.y)*0.12;
  pull.vx *= 0.78; pull.vy *= 0.78; pull.x += pull.vx; pull.y += pull.vy;

  const hover = roundBoxSDF(mouse.x, mouse.y, cx, cy, hw, halfH) < 0;
  const sTarget = pressed ? 0.88 : hover ? 1.06 : 1;
  scale.vel += (sTarget - scale.v)*0.2; scale.vel *= 0.82; scale.v += scale.vel;
  const pl = Math.hypot(pull.x, pull.y);
  const dir = pl > 0.001 ? [pull.x/pl, pull.y/pl] : [1, 0];
  const stretch = Math.min(0.35, pl/halfH*0.28)*params.bend + (pressed ? 0.08 : 0);

  const target = recording ? fakeVoice(t) : 0;
  level += (target - level)*(target > level ? 0.35 : 0.12);

  // camera parallax follows the pointer gently
  const inside = mouse.x > -999;
  const px = inside ? (mouse.x/W - 0.5) : 0, py = inside ? (mouse.y/H - 0.5) : 0;
  par.x += (px - par.x)*0.04; par.y += (py - par.y)*0.04;

  // pass 1: scene
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, sw, sh);
  gl.useProgram(sceneP.p);
  gl.uniform2f(sceneP.U.uRes, sw, sh); gl.uniform1f(sceneP.U.uTime, t);
  gl.uniform1f(sceneP.U.uExpo, params.expo); gl.uniform1i(sceneP.U.uScene, scene);
  gl.uniform2f(sceneP.U.uPar, par.x, par.y);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindTexture(gl.TEXTURE_2D, tex); gl.generateMipmap(gl.TEXTURE_2D);

  // pass 2: glass composite
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(glassP.p);
  const U = glassP.U;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(U.uTex, 0);
  gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uDpr, dpr); gl.uniform1f(U.uTime, t); gl.uniform1f(U.uLevel, level);
  gl.uniform1f(U.uRefr, params.refr); gl.uniform1f(U.uBlur, params.blur); gl.uniform1f(U.uChroma, params.chroma);
  gl.uniform1f(U.uBend, params.bend); gl.uniform1f(U.uBloom, params.bloom); gl.uniform1f(U.uStretch, stretch);
  gl.uniform2f(U.uCenter, cx, cy); gl.uniform2f(U.uHalf, hw*scale.v, halfH*scale.v);
  gl.uniform2f(U.uPull, pull.x, pull.y); gl.uniform2f(U.uMouse, mouse.x, mouse.y);
  gl.uniform2f(U.uDir, dir[0], dir[1]);
  gl.uniform2f(U.uOffset, pull.x*0.3*params.bend, pull.y*0.3*params.bend);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  btn.style.left = cx + 'px'; btn.style.top = cy + 'px';
  btn.style.width = (hw*2) + 'px'; btn.style.height = (halfH*2) + 'px';
  hint.style.left = cx + 'px'; hint.style.top = (cy + halfH + 26) + 'px';
  if (recording) {
    barEls.forEach((b, i) => { const v = level*(0.45 + 0.55*Math.abs(Math.sin(t*9 + i*1.3))); b.style.height = (4 + v*22) + 'px'; });
    const s = Math.floor((now - recStart)/1000); clock.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2, '0');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body>
